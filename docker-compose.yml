services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      APP_USER_SESSION_TTL: ${APP_USER_SESSION_TTL}
      APP_LIKE_TTL: ${APP_LIKE_TTL}
      APP_EVENT_REVIEWS_TTL: ${APP_EVENT_REVIEWS_TTL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS}
      MONGODB_CONNECT_TIMEOUT_MS: ${MONGODB_CONNECT_TIMEOUT_MS}
      MONGODB_SOCKET_TIMEOUT_MS: ${MONGODB_SOCKET_TIMEOUT_MS}
      CASSANDRA_HOSTS: ${CASSANDRA_HOSTS}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      CASSANDRA_CONSISTENCY: ${CASSANDRA_CONSISTENCY}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      mongos:
        condition: service_healthy
      cassandra-setup:
        condition: service_completed_successfully
      mongo-setup:
        condition: service_completed_successfully

  cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: eventhub
      CASSANDRA_START_RPC: "true"
    ports:
      - "${CASSANDRA_PORT}:${CASSANDRA_PORT}"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 ${CASSANDRA_PORT} -e 'SHOW VERSION'"]
      interval: 15s
      timeout: 10s
      retries: 20

  cassandra-setup:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOSTS: ${CASSANDRA_HOSTS}
      CASSANDRA_PORT: ${CASSANDRA_PORT}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
    volumes:
      - ./cassandra/init-cluster.sh:/scripts/init-cluster.sh:ro
    command:
      - sh
      - /scripts/init-cluster.sh

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command:
      - sh
      - -c
      - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            exec redis-server --appendonly yes --port "$$REDIS_PORT" --requirepass "$$REDIS_PASSWORD"
          else
            exec redis-server --appendonly yes --port "$$REDIS_PORT"
          fi
    healthcheck:
      test:
        - CMD-SHELL
        - |
            if [ -n "$$REDIS_PASSWORD" ]; then
              redis-cli -p "$$REDIS_PORT" -a "$$REDIS_PASSWORD" ping
            else
              redis-cli -p "$$REDIS_PORT" ping
            fi
      interval: 10s
      timeout: 5s
      retries: 5

  configsvr01:
    image: mongo:8.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_CONFIGSVR01_PORT:-27019}"
    ports:
      - "${MONGODB_CONFIGSVR01_PORT:-27019}:${MONGODB_CONFIGSVR01_PORT:-27019}"
    volumes:
      - configsvr01_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_CONFIGSVR01_PORT:-27019} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  configsvr02:
    image: mongo:8.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_CONFIGSVR02_PORT:-27020}"
    ports:
      - "${MONGODB_CONFIGSVR02_PORT:-27020}:${MONGODB_CONFIGSVR02_PORT:-27020}"
    volumes:
      - configsvr02_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_CONFIGSVR02_PORT:-27020} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  configsvr03:
    image: mongo:8.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_CONFIGSVR03_PORT:-27021}"
    ports:
      - "${MONGODB_CONFIGSVR03_PORT:-27021}:${MONGODB_CONFIGSVR03_PORT:-27021}"
    volumes:
      - configsvr03_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_CONFIGSVR03_PORT:-27021} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  shard1-01:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1ReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_SHARD1_01_PORT:-27118}"
    ports:
      - "${MONGODB_SHARD1_01_PORT:-27118}:${MONGODB_SHARD1_01_PORT:-27118}"
    volumes:
      - shard1_01_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_SHARD1_01_PORT:-27118} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  shard1-02:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1ReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_SHARD1_02_PORT:-27119}"
    ports:
      - "${MONGODB_SHARD1_02_PORT:-27119}:${MONGODB_SHARD1_02_PORT:-27119}"
    volumes:
      - shard1_02_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_SHARD1_02_PORT:-27119} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  shard1-03:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1ReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_SHARD1_03_PORT:-27120}"
    ports:
      - "${MONGODB_SHARD1_03_PORT:-27120}:${MONGODB_SHARD1_03_PORT:-27120}"
    volumes:
      - shard1_03_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_SHARD1_03_PORT:-27120} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  shard2-01:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2ReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_SHARD2_01_PORT:-27218}"
    ports:
      - "${MONGODB_SHARD2_01_PORT:-27218}:${MONGODB_SHARD2_01_PORT:-27218}"
    volumes:
      - shard2_01_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_SHARD2_01_PORT:-27218} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  shard2-02:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2ReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_SHARD2_02_PORT:-27219}"
    ports:
      - "${MONGODB_SHARD2_02_PORT:-27219}:${MONGODB_SHARD2_02_PORT:-27219}"
    volumes:
      - shard2_02_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_SHARD2_02_PORT:-27219} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  shard2-03:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2ReplSet
      - --bind_ip_all
      - --port
      - "${MONGODB_SHARD2_03_PORT:-27220}"
    ports:
      - "${MONGODB_SHARD2_03_PORT:-27220}:${MONGODB_SHARD2_03_PORT:-27220}"
    volumes:
      - shard2_03_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_SHARD2_03_PORT:-27220} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongos:
    image: mongo:8.0
    command:
      - mongos
      - --configdb
      - configReplSet/configsvr01:${MONGODB_CONFIGSVR01_PORT:-27019},configsvr02:${MONGODB_CONFIGSVR02_PORT:-27020},configsvr03:${MONGODB_CONFIGSVR03_PORT:-27021}
      - --bind_ip_all
      - --port
      - "${MONGODB_PORT}"
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    restart: unless-stopped
    depends_on:
      configsvr01:
        condition: service_started
      configsvr02:
        condition: service_started
      configsvr03:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port ${MONGODB_PORT} --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 20

  mongo-setup:
    image: mongo:8.0
    depends_on:
      configsvr01:
        condition: service_healthy
      configsvr02:
        condition: service_healthy
      configsvr03:
        condition: service_healthy
      shard1-01:
        condition: service_healthy
      shard1-02:
        condition: service_healthy
      shard1-03:
        condition: service_healthy
      shard2-01:
        condition: service_healthy
      shard2-02:
        condition: service_healthy
      shard2-03:
        condition: service_healthy
      mongos:
        condition: service_started
    environment:
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_APP_USER: ${MONGODB_APP_USER}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_CONFIGSVR01_PORT: ${MONGODB_CONFIGSVR01_PORT:-27019}
      MONGODB_CONFIGSVR02_PORT: ${MONGODB_CONFIGSVR02_PORT:-27020}
      MONGODB_CONFIGSVR03_PORT: ${MONGODB_CONFIGSVR03_PORT:-27021}
      MONGODB_SHARD1_01_PORT: ${MONGODB_SHARD1_01_PORT:-27118}
      MONGODB_SHARD1_02_PORT: ${MONGODB_SHARD1_02_PORT:-27119}
      MONGODB_SHARD1_03_PORT: ${MONGODB_SHARD1_03_PORT:-27120}
      MONGODB_SHARD2_01_PORT: ${MONGODB_SHARD2_01_PORT:-27218}
      MONGODB_SHARD2_02_PORT: ${MONGODB_SHARD2_02_PORT:-27219}
      MONGODB_SHARD2_03_PORT: ${MONGODB_SHARD2_03_PORT:-27220}
    volumes:
      - ./mongodb/init-cluster.sh:/scripts/init-cluster.sh:ro
    command:
      - sh
      - /scripts/init-cluster.sh

volumes:
  cassandra_data:
  configsvr01_data:
  configsvr02_data:
  configsvr03_data:
  shard1_01_data:
  shard1_02_data:
  shard1_03_data:
  shard2_01_data:
  shard2_02_data:
  shard2_03_data:
